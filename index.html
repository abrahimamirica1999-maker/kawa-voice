<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<meta name="theme-color" content="#A8701F">
<title>وشەکانی فلاشکارت</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EFF2F1; --surface:#FFFFFF; --raise:#F7F9F8;
  --ink:#16201E; --muted:#5E6D69; --faint:#8B9995;
  --line:#D4DCD9; --line-strong:#B9C5C1;
  --accent:#A8701F; --accent-ink:#7A4F12; --accent-soft:#F6E9D5;
  --done:#2E6B51; --done-soft:#E0EFE7; --on-accent:#FFFFFF;
  --std:#EFE6F5; --std-line:#C9B5DA; --std-ink:#5A4370;
  --shadow:0 1px 2px rgba(22,32,30,.06),0 8px 24px rgba(22,32,30,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1614; --surface:#18211F; --raise:#1E2926;
    --ink:#E7EEEB; --muted:#93A29D; --faint:#74837E;
    --line:#26332F; --line-strong:#35443F;
    --accent:#D19B4E; --accent-ink:#E9BE7C; --accent-soft:#2B2216;
    --done:#6FBF95; --done-soft:#172A21; --on-accent:#1B1206;
    --std:#241C2E; --std-line:#493A5C; --std-ink:#C6B2DA;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1614; --surface:#18211F; --raise:#1E2926;
  --ink:#E7EEEB; --muted:#93A29D; --faint:#74837E;
  --line:#26332F; --line-strong:#35443F;
  --accent:#D19B4E; --accent-ink:#E9BE7C; --accent-soft:#2B2216;
  --done:#6FBF95; --done-soft:#172A21; --on-accent:#1B1206;
  --std:#241C2E; --std-line:#493A5C; --std-ink:#C6B2DA;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:"Noto Kufi Arabic",system-ui,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.7; -webkit-text-size-adjust:100%;
}
[hidden]{display:none!important}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:0 148px}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--ground);padding-block:12px 8px}
.toprow{display:flex;align-items:center;gap:10px}
.brand{font-size:15px;font-weight:700;white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:400;color:var(--faint)}
.count{margin-inline-start:auto;font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;text-align:end}
.count b{color:var(--ink);font-size:16px}
.bar{height:4px;border-radius:99px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;
  transition:width .25s ease}
.sync{font-size:11.5px;color:var(--faint);margin-top:6px;min-height:16px}
.sync.on{color:var(--done)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px;box-shadow:var(--shadow);margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--raise);
  color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.cat{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip.ok{background:var(--done-soft);color:var(--done);border-color:transparent}

.h1{font-size:22px;font-weight:700;line-height:1.45;margin:2px 0 10px}
.p{color:var(--muted);white-space:pre-line}

/* ---------- section list ---------- */
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;
  margin-top:12px}
.sec{text-align:start;font:inherit;cursor:pointer;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);
  box-shadow:var(--shadow)}
.sec:hover{border-color:var(--line-strong)}
.sec.full{background:var(--done-soft);border-color:transparent}
.sec.here{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.sec b{display:block;font-size:14px;margin-bottom:5px}
.sec .sn{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec .sbar{display:block;height:3px;border-radius:99px;background:var(--line);
  margin-top:7px;overflow:hidden}
.sec .sbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sec.full .sbar i{background:var(--done)}

/* ---------- one item ---------- */
.ref{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.ref .lbl{font-size:11px;color:var(--accent-ink);font-weight:700;margin-bottom:5px;
  letter-spacing:.02em}
.ref .en{direction:ltr;text-align:left;font-family:system-ui,sans-serif;
  font-size:16.5px;line-height:1.55;color:var(--ink)}
.ar{background:var(--raise);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;font-size:14.5px;color:var(--muted);margin-bottom:10px;
  font-family:"Noto Naskh Arabic","Noto Kufi Arabic",serif}
.ar .lbl{font-size:11px;color:var(--faint);font-family:"Noto Kufi Arabic",sans-serif;
  margin-bottom:3px}
.std{background:var(--std);border-radius:12px;padding:12px 14px;margin-top:12px;
  box-shadow:inset 3px 0 0 var(--std-line)}
.std .lbl{font-size:11px;color:var(--std-ink);font-weight:700;margin-bottom:5px}
.std .t{font-size:17px;line-height:1.7;word-wrap:break-word}
.lbl2{font-size:12px;color:var(--muted);margin-bottom:6px}
textarea{width:100%;min-height:92px;resize:vertical;border-radius:12px;
  border:1.5px solid var(--line-strong);background:var(--surface);color:var(--ink);
  padding:12px 14px;font:inherit;font-size:17px;line-height:1.8}
textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12px;color:var(--faint);margin-top:7px;line-height:1.6}

/* ---------- buttons ---------- */
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;cursor:pointer;border-radius:12px;padding:11px 16px;
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);
  font-weight:700}
button.good{background:var(--done-soft);border-color:transparent;color:var(--done);
  font-weight:700}
button.ghost{background:transparent;border-color:var(--line)}
button.nav{min-width:52px;font-size:18px;line-height:1}

.foot{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.footin{max-width:660px;margin:0 auto;display:flex;gap:8px;align-items:center}
.footin .primary{flex:1}

dialog{border:0;border-radius:16px;padding:0;background:transparent;max-width:92vw}
dialog::backdrop{background:rgba(10,16,15,.5)}
.dlg{background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;
  box-shadow:var(--shadow);max-width:420px}
.dlg h3{margin:0 0 8px;font-size:17px}
.dlg p{margin:0 0 6px;color:var(--muted);font-size:14px}
.tip{background:var(--raise);border:1px dashed var(--line-strong);border-radius:10px;
  padding:9px 12px;font-size:13px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>

<div class="top">
  <div class="wrap" style="padding-block:0">
    <div class="toprow">
      <div class="brand">وشەکانی فلاشکارت<small id="label">بۆ هەولێری</small></div>
      <div class="count" id="count"></div>
    </div>
    <div class="bar"><i id="barfill" style="width:0%"></i></div>
    <div class="sync" id="syncLine"></div>
  </div>
</div>

<div class="wrap">

  <!-- intro -->
  <div id="scIntro" hidden>
    <div class="card">
      <div class="h1">سڵاو 🌿</div>
      <p class="p" id="introText"></p>
      <div class="btns"><button class="primary" id="btnStart">دەست پێبکە</button></div>
    </div>
  </div>

  <!-- section hub -->
  <div id="scHub" hidden>
    <div class="card">
      <div class="h1">بەشەکان</div>
      <p class="p" id="hubNote"></p>
      <div class="btns"><button class="primary" id="btnResume"></button></div>
    </div>
    <div class="secs" id="secList"></div>
  </div>

  <!-- one word -->
  <div id="scItem" hidden>
    <div class="card">
      <div class="chips" id="itChips"></div>
      <div class="ref" id="itEnWrap" hidden>
        <div class="lbl">مانا بە ئینگلیزی</div>
        <div class="en" id="itEn"></div>
      </div>
      <div class="ar" id="itArWrap" hidden>
        <div class="lbl">بە عەرەبی</div><span id="itAr"></span>
      </div>
      <div class="lbl2">بە هەولێری — ئەگەر لە هەولێر وا ناڵێن، بیگۆڕە</div>
      <textarea id="itKu" spellcheck="false"></textarea>
      <div class="hint" id="itHint"></div>
      <div class="tip" id="itTipWrap" hidden><span id="itTip"></span></div>
      <div class="std" id="itStdWrap" hidden>
        <div class="lbl">بە کوردیی ستاندارد</div>
        <div class="t" id="itStd"></div>
      </div>
      <div class="btns">
        <button class="good" id="btnOk">ڕاستە ✓</button>
        <button class="ghost" id="btnHub">لیستی بەشەکان</button>
      </div>
    </div>
  </div>

  <!-- section finished -->
  <div id="scSec" hidden>
    <div class="card">
      <div class="h1" id="secTitle"></div>
      <p class="p" id="secNote"></p>
      <div class="btns">
        <button class="primary" id="btnNextSec">بەشی دواتر</button>
        <button class="ghost" id="btnSecHub">لیستی بەشەکان</button>
      </div>
    </div>
  </div>

  <!-- all finished -->
  <div id="scDone" hidden>
    <div class="card">
      <div class="h1">تەواو بوو 🌿</div>
      <p class="p">زۆر سوپاس. هەموو شتێک پارێزراوە و نێردراوە.</p>
      <div class="btns">
        <button class="primary" id="btnSend2">دووبارە بینێرە</button>
        <button class="ghost" id="btnDoneHub">لیستی بەشەکان</button>
      </div>
    </div>
  </div>
</div>

<div class="foot">
  <div class="footin">
    <button class="nav ghost" id="btnPrev" aria-label="پێشوو">→</button>
    <button class="primary" id="btnNext">دواتر</button>
    <button class="nav ghost" id="btnSend" aria-label="ناردن">↑</button>
  </div>
</div>

<dialog id="dlgSend"><div class="dlg">
  <h3>ناردن</h3>
  <p id="sendWarn"></p>
  <div class="btns">
    <button class="primary" id="doSend">بینێرە</button>
    <button class="ghost" id="doAll">هەمووی بنێرەوە</button>
    <button class="ghost" id="doCopy">کۆپی بکە</button>
    <button class="ghost" id="doClose">داخستن</button>
  </div>
</div></dialog>

<script>
/* ────────────────────────────────────────────────────────────────────────────
   flashcards. The unit is ONE flashcard word of the Standard Kurdish deck, to
   be turned into Hawleri. The box arrives pre-filled with the Standard word;
   "ڕاستە" says Hawleri uses it unchanged, anything typed replaces it.

   Cards whose Standard word she already converted in the hawleri-tests round
   (same word, same meaning) are flagged `h` and arrive pre-filled with HER
   word, so she only confirms them; like every card, they count only once she
   taps "ڕاستە" or edits. `t` is a hint: the same word appeared in the tests with another
   meaning, so her test answer is shown but not applied.

   Sections are the deck's categories. The sheet's Apps Script (shared with the
   Kawa batches) REPLACES every row of one device+batch on each post, so each
   category is its own batch ("flashcards:07") and a post always carries ALL
   answered words of that category. Only categories touched since the last
   acknowledged post are re-sent (st.dirty).

   The sheet's 11 columns, for these batches:
     q_id              f + the card's uuid[:8]
     category          the category (English)
     question_arabic   the card's Arabic
     question_kurdish  the Standard Kurdish word, as stored
     her_hawleri_answer  her Hawleri
     draft_was_shown   "tests" (pre-filled with her test answer) | "standard"
     draft_text        what the box was pre-filled with
   The English is NOT round-tripped — it rejoins from items.json on q_id.
   ──────────────────────────────────────────────────────────────────────────── */
var SHEET_URL="https://script.google.com/macros/s/AKfycbyfV4KhWyYIbwOBCtd9G-Ovn9RzuP5G_7_N8tABEPN7UcykN9EgGNI54FRZW-ryJvRGhA/exec";
var QCACHE="kawa_voice_flashcards", AR="٠١٢٣٤٥٦٧٨٩";
var lastPush=0, pushTimer=null, saveTimer=null, pushing=false;
var DATA=null, SECS=[], ITEMS=[], BYSEC=[], NH=0, BATCH="", KEY="";
var st={v:"intro",cur:0,ans:{},dirty:{},sent:0,synced:0,dev:""};

function fa(n){return String(n).replace(/\d/g,function(x){return AR[+x]})}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,300)}

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){var p=JSON.parse(raw);
      st.v=p.v||"intro"; st.cur=p.cur||0; st.ans=p.ans||{}; st.dirty=p.dirty||{};
      st.sent=p.sent||0; st.synced=p.synced||0; st.dev=p.dev||"";}
  }catch(e){}
  if(!st.dev) st.dev="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  if(!(st.cur>=0)||st.cur>=ITEMS.length) st.cur=0;
}

/* ---- helpers ---- */
function sec(i){return ITEMS[i].c}
function secStart(s){return BYSEC[s].a}
function secEnd(s){return BYSEC[s].b}
function nextSec(s){for(var k=s+1;k<SECS.length;k++) if(secEnd(k)>secStart(k)) return k; return -1}
function answered(id){return !!(st.ans[id]&&st.ans[id].trim())}
function filled(){var n=0;for(var i=0;i<ITEMS.length;i++) if(answered(ITEMS[i].id)) n++;return n}
function secFilled(s){
  var n=0,e=secEnd(s);
  for(var i=secStart(s);i<e;i++) if(answered(ITEMS[i].id)) n++;
  return n;
}
function dirtyCount(){var n=0;for(var k in st.dirty)n++;return n}
function firstOpen(){
  for(var i=0;i<ITEMS.length;i++) if(!answered(ITEMS[i].id)) return i;
  return -1;
}
function batchOf(s){return BATCH+":"+(s<10?"0":"")+s}

/* ---- rendering ---- */
function renderHub(){
  var f=filled(), left=ITEMS.length-f, o=firstOpen();
  $("hubNote").textContent = f
    ? "لە "+fa(ITEMS.length)+" وشە، "+fa(f)+"ت تەواو کردووە. "+fa(left)+" ماوە."
    : "هەموو "+fa(ITEMS.length)+" وشەکە بەپێی بابەت لە "+fa(SECS.length)+" بەشدا دانراون. "+
      "دەتوانی لە هەر بەشێکەوە دەست پێبکەی.";
  $("btnResume").textContent = o<0 ? "هەمووی تەواو بووە ✓"
    : (f ? "بەردەوام بە" : "دەست پێبکە");
  $("btnResume").disabled = o<0;
  var h=[], here=ITEMS.length?sec(st.cur):-1;
  for(var s=0;s<SECS.length;s++){
    var t=secEnd(s)-secStart(s); if(!t) continue;
    var n=secFilled(s), pc=Math.round(100*n/t);
    h.push('<button class="sec'+(n===t?" full":"")+(s===here?" here":"")+
      '" data-s="'+s+'">'+
      '<b>'+esc(SECS[s].ku)+(n===t?' ✓':'')+'</b>'+
      '<span class="sn">'+fa(n)+' لە '+fa(t)+'</span>'+
      '<span class="sbar"><i style="width:'+pc+'%"></i></span></button>');
  }
  $("secList").innerHTML=h.join("");
  var bs=$("secList").getElementsByTagName("button");
  for(var k=0;k<bs.length;k++) bs[k].onclick=function(){
    var s=+this.getAttribute("data-s"), e=secEnd(s), go=secStart(s);
    for(var i=secStart(s);i<e;i++){ if(!answered(ITEMS[i].id)){go=i;break} }
    st.cur=go; st.v="item"; save(); render(); window.scrollTo(0,0);
  };
}
function renderItem(){
  var it=ITEMS[st.cur], s=sec(st.cur), a=(st.ans[it.id]||"").trim();
  $("itChips").innerHTML=
    '<span class="chip cat">'+esc(SECS[s].ku)+'</span>'+
    '<span class="chip">وشەی '+fa(st.cur-secStart(s)+1)+' لە '+fa(secEnd(s)-secStart(s))+'</span>'+
    (it.h?'<span class="chip">لە تاقیکردنەوەکانەوە</span>':'')+
    (a?'<span class="chip ok">تەواو ✓</span>':'');
  $("itEnWrap").hidden=!it.en; if(it.en) $("itEn").textContent=it.en;
  $("itArWrap").hidden=!it.ar; if(it.ar) $("itAr").textContent=it.ar;
  $("itStd").textContent=it.s;
  $("itKu").value=a||it.p;
  $("itTipWrap").hidden=!it.t;
  if(it.t) $("itTip").textContent="لە تاقیکردنەوەکاندا ئەم وشەیە"+
    (it.t[1]?" بە مانای «"+it.t[1]+"»":"")+" هاتبوو و تۆ نووسیبووت: "+it.t[0];
  showOrig();
  $("itHint").textContent = a
    ? "پێشتر وەڵامت داوەتەوە. دەتوانیت بیگۆڕیت."
    : it.h
    ? "ئەمە ئەو هەولێرییەیە کە خۆت لە تاقیکردنەوەکاندا نووسیوتە. ئەگەر بۆ ئەم مانایە ڕاستە، «ڕاستە ✓» لێ بدە. ئەگەر نا، بیگۆڕە."
    : "ئەمە وشەی کوردیی ستانداردە. ئەگەر لە هەولێریش هەروا دەیڵێن، «ڕاستە ✓» لێ بدە. ئەگەر نا، بیگۆڕە.";
  $("btnNext").textContent = (st.cur+1>=secEnd(s)) ? "کۆتایی بەش" : "دواتر";
}
function showOrig(){
  var it=ITEMS[st.cur];
  $("itStdWrap").hidden=!it.h&&$("itKu").value.trim()===it.p;
}
function renderSec(){
  var s=sec(st.cur), n=secFilled(s), t=secEnd(s)-secStart(s);
  $("secTitle").textContent="«"+SECS[s].ku+"» تەواو بوو";
  $("secNote").textContent = n<t
    ? "لەم بەشەدا "+fa(n)+" لە "+fa(t)+" وشە تەواو بووە. دەتوانی بگەڕێیەوە و ئەوانی تریش تەواو بکەی."
    : "هەموو "+fa(t)+" وشەکەی ئەم بەشە تەواو بوون. زۆر سوپاس 🌿";
  $("btnNextSec").hidden = nextSec(s)<0;
}
function render(){
  $("scIntro").hidden=st.v!=="intro";
  $("scHub").hidden=st.v!=="hub";
  $("scItem").hidden=st.v!=="item";
  $("scSec").hidden=st.v!=="sec";
  $("scDone").hidden=st.v!=="done";
  var isItem=st.v==="item";
  $("btnNext").hidden=!isItem;
  $("btnPrev").hidden=!isItem;
  $("btnPrev").disabled=st.cur<=0;
  if(st.v==="hub") renderHub();
  if(isItem) renderItem();
  if(st.v==="sec") renderSec();
  if(st.v==="intro") $("introText").textContent=
    "ئەمانە وشەکانی فلاشکارتی کوردیی ستانداردن، بەپێی بابەت لە "+fa(SECS.length)+" بەشدا.\n\n"+
    "هەر وشەیەک بیکە بە هەولێری، وەک لە هەولێر دەیڵێن. ئەگەر وشەکە لە هەولێریش هەروایە، تەنها «ڕاستە ✓» لێ بدە.\n\n"+
    fa(NH)+" وشەیان پێشتر لە تاقیکردنەوەکاندا ڕاستت کردوونەتەوە؛ ئەوانە بە هەولێرییەکەی خۆت نووسراون "+
    "و نیشانەی «لە تاقیکردنەوەکانەوە»یان لەسەرە. تەنها دڵنیابەرەوە کە بۆ ئەو مانایە ڕاستن.\n\nهەرچی دەنووسی لە مۆبایلەکەت دەپارێزرێت و خۆی دەنێردرێت.";
  var f=filled();
  $("count").innerHTML="<b>"+fa(f)+"</b> / "+fa(ITEMS.length);
  $("barfill").style.width=(ITEMS.length?Math.round(100*f/ITEMS.length):0)+"%";
  save();
}

/* ---- movement ---- */
function setAns(it,v){
  if(v!==st.ans[it.id]){ st.ans[it.id]=v; st.dirty[it.c]=1 }
}
function commit(){
  if(st.v!=="item") return;
  var it=ITEMS[st.cur], v=$("itKu").value.trim();
  if(!v) return;
  // The box arrives pre-filled with the Standard word, so paging past a word
  // must NOT count as "Hawleri says it the same way" -- that would ship
  // Standard text to the sheet as her answer. Only an edit, or "ڕاستە ✓".
  if(v===it.p&&!answered(it.id)) return;
  setAns(it,v);
}
function goItem(d){
  commit();
  var s=sec(st.cur), n=st.cur+d;
  if(n<0) n=0;
  if(n>=secEnd(s)){
    st.v = (nextSec(s)<0) ? "done" : "sec";
    save(); push(true); render(); window.scrollTo(0,0); return;
  }
  st.cur=n; save(); push(); render(); window.scrollTo(0,0);
}
function toHub(){commit();st.v="hub";save();push();render();window.scrollTo(0,0)}

/* ---- payload ---- */
function rowsOf(s){
  var out=[], e=secEnd(s);
  for(var i=secStart(s);i<e;i++){
    var it=ITEMS[i], a=(st.ans[it.id]||"").trim();
    if(!a) continue;
    out.push({id:it.id,n:i+1,cat:SECS[s].name,ar:it.ar,ku:it.s,answer:a,
              drafted:it.h?"tests":"standard",draft:it.p});
  }
  return out;
}
function payload(s,r){
  return JSON.stringify({device:st.dev,batch:batchOf(s),at:new Date().toISOString(),rows:r});
}
function csv(){
  var r=[["batch","q_id","q_no","category","english","arabic","standard_kurdish",
          "her_hawleri","prefilled"]];
  for(var s=0;s<SECS.length;s++){
    var e=secEnd(s);
    for(var i=secStart(s);i<e;i++){
      var it=ITEMS[i], a=(st.ans[it.id]||"").trim(); if(!a) continue;
      r.push([batchOf(s),it.id,i+1,SECS[s].name,it.en,it.ar,it.s,a,it.p]);
    }
  }
  return r.map(function(x){return x.map(function(c){
    c=String(c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c
  }).join(",")}).join("\r\n");
}
function stamp(){
  if(!st.synced) return "";
  var d=new Date(st.synced);
  function two(x){return (x<10?"0":"")+x}
  return "دوایین ناردن "+two(d.getHours())+":"+two(d.getMinutes())+
         (dirtyCount()?" — هەندێکی چاوەڕێی ناردنە":"");
}
/* One category per POST, one after another: the script holds a lock, and a
   category is only marked clean once its post has gone out. */
function push(force,all){
  if(!SHEET_URL) return;
  if(pushing) return;
  if(!force&&Date.now()-lastPush<4000){
    clearTimeout(pushTimer); pushTimer=setTimeout(function(){push(true)},4000); return;
  }
  var q=[];
  for(var s=0;s<SECS.length;s++){
    if(!(all||st.dirty[s])) continue;
    var r=rowsOf(s);
    if(r.length) q.push([s,r]); else delete st.dirty[s];
  }
  if(!q.length) return;
  lastPush=Date.now(); pushing=true;
  var line=$("syncLine"); line.className="sync"; line.textContent="…ناردن";
  (function next(k){
    if(k>=q.length){
      pushing=false; st.synced=Date.now(); save();
      line.className="sync on"; line.textContent="نێردرا ✓";
      setTimeout(function(){line.className="sync";line.textContent=stamp()},2500);
      return;
    }
    var s=q[k][0], body=payload(s,q[k][1]);
    fetch(SHEET_URL,{method:"POST",mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"},body:body
    }).then(function(){
      // still dirty if she changed this category while the post was out
      if(JSON.stringify(rowsOf(s))===JSON.stringify(q[k][1])) delete st.dirty[s];
      save(); next(k+1);
    }).catch(function(){
      pushing=false;
      line.className="sync"; line.textContent="ئینتەرنێت نییە — لە مۆبایلەکەت پارێزراوە";
    });
  })(0);
}
function beacon(){
  if(!SHEET_URL||!navigator.sendBeacon) return;
  try{
    for(var s in st.dirty){
      s=+s; var r=rowsOf(s); if(!r.length) continue;
      var body=new Blob([payload(s,r)],{type:"text/plain;charset=utf-8"});
      if(navigator.sendBeacon(SHEET_URL,body)){ delete st.dirty[s]; st.synced=Date.now() }
    }
    save();
  }catch(e){}
}
function openSend(){
  var f=filled(), p=dirtyCount();
  $("sendWarn").textContent = p
    ? "لە "+fa(ITEMS.length)+" وشە، "+fa(f)+"ت تەواو کردووە. هەندێکیان هێشتا نەنێردراون."
    : (f ? "هەموو ئەوەی تەواوت کردووە ("+fa(f)+") نێردراوە ✓"
         : "هێشتا هیچ وەڵامێک نییە.");
  $("dlgSend").showModal();
}

/* ---- events ---- */
function bind(){
  $("btnStart").onclick=function(){st.v="hub";save();render();window.scrollTo(0,0)};
  $("btnResume").onclick=function(){
    var o=firstOpen(); if(o>=0) st.cur=o;
    st.v="item"; save(); render(); window.scrollTo(0,0);
  };
  $("btnNext").onclick=function(){goItem(1)};
  $("btnPrev").onclick=function(){goItem(-1)};
  $("btnHub").onclick=toHub;
  $("btnSecHub").onclick=toHub;
  $("btnDoneHub").onclick=toHub;
  $("btnNextSec").onclick=function(){
    var s=nextSec(sec(st.cur));
    if(s<0){st.v="done"} else {st.cur=secStart(s); st.v="item"}
    save(); render(); window.scrollTo(0,0);
  };
  $("btnSend").onclick=openSend;
  $("btnSend2").onclick=openSend;
  $("doClose").onclick=function(){$("dlgSend").close()};
  $("doSend").onclick=function(){push(true);$("dlgSend").close()};
  $("doAll").onclick=function(){push(true,true);$("dlgSend").close()};
  $("doCopy").onclick=function(){
    var b=$("doCopy"), t=csv();
    function ok(){b.textContent="کۆپی کرا ✓";st.sent=Date.now();save();
      setTimeout(function(){b.textContent="کۆپی بکە"},2000)}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(ok,function(){fallback(t,ok)});
    }else fallback(t,ok);
  };
  function fallback(t,ok){
    var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);
    a.select();try{document.execCommand("copy");ok()}catch(e){}
    document.body.removeChild(a);
  }
  $("itKu").addEventListener("input",function(){commit();showOrig();saveSoon()});
  $("btnOk").onclick=function(){
    if(st.v!=="item") return;
    var it=ITEMS[st.cur];
    if(!$("itKu").value.trim()) $("itKu").value=it.p;
    setAns(it,$("itKu").value.trim());
    goItem(1);
  };
  window.addEventListener("pagehide",function(){commit();save();beacon()});
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden"){commit();save();beacon()}
  });
}

/* ---- boot ---- */
function boot(data){
  DATA=data;
  SECS=data.sections||[];
  var all=data.items||[];
  ITEMS=all; NH=0;
  for(var i=0;i<all.length;i++) if(all[i].h) NH++;
  BYSEC=[];
  for(var s=0;s<SECS.length;s++) BYSEC.push({a:0,b:0});
  for(var j=ITEMS.length-1;j>=0;j--) BYSEC[ITEMS[j].c].a=j;
  for(var j2=0;j2<ITEMS.length;j2++) BYSEC[ITEMS[j2].c].b=j2+1;
  BATCH=data.batch||"flashcards";
  KEY="kawa_voice_fc_v1:"+BATCH;
  try{localStorage.setItem(QCACHE,JSON.stringify(data))}catch(e){}
  load(); bind(); render();
  if(data.label) $("label").textContent=data.label;
  $("syncLine").textContent=stamp();
  push(true);
}
function fail(){
  $("scIntro").hidden=false;
  $("introText").textContent="نەتوانرا وشەکان باربکرێن. تکایە ئینتەرنێت بپشکنە و لاپەڕەکە تازە بکەرەوە.";
  $("btnStart").hidden=true;
  $("btnNext").hidden=true; $("btnPrev").hidden=true;
}
fetch("items.json?v="+Date.now()).then(function(r){
  if(!r.ok) throw 0; return r.json();
}).then(boot).catch(function(){
  try{
    var c=localStorage.getItem(QCACHE);
    if(c){boot(JSON.parse(c));return}
  }catch(e){}
  fail();
});
</script>
